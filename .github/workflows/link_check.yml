name: Link checker
on:
  push:
    paths:
      - '**.md'
  pull_request:
    paths:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-link-check:
    name: Check links in markdown
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --exclude 'https://github\.com/settings/apps/new'
            --exclude 'https://github\.com/organizations/.*/settings/apps/new'
            --exclude 'https://docs\.redhat\.com/'
            '**/*.md'
